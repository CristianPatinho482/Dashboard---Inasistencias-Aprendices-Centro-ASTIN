name: Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astin-swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar agregación y API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar copia de agregación
        run: python3 scripts/10_sincronizar_agregacion.py --check

      - name: Instalar dependencias de la API
        working-directory: api
        run: npm ci --no-audit --no-fund

      - name: Probar agregación
        working-directory: api
        run: npm test

  deploy:
    name: Desplegar en Azure Static Web Apps
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Desplegar
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "web"
          api_location: "api"
          output_location: ""
          skip_app_build: true
